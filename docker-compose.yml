version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: portfolio_db
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: rashid
      POSTGRES_PASSWORD: securepassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio_backend
    volumes:
      - django-static:/app/static
      - django-media:/app/media
    environment:
      - DATABASE_URL=postgres://rashid:securepassword@db:5432/portfolio
      - DJANGO_SECRET_KEY=django-secure-production-key-rashid-12345
      - DJANGO_DEBUG=False
      - ALLOWED_HOSTS=backend,localhost,127.0.0.1
      - STATIC_URL=/static/django/
    depends_on:
      - db
    expose:
      - "8000"
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portfolio_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost/api
      - PORT=3000
    depends_on:
      - backend
    expose:
      - "3000"
    restart: always

  nginx:
    image: nginx:alpine
    container_name: portfolio_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - django-static:/app/static:ro
      - django-media:/app/media:ro
    depends_on:
      - frontend
      - backend
    restart: always

volumes:
  pgdata:
  django-static:
  django-media:
