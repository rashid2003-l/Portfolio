services:
  # Django API Backend
  - type: web
    name: portfolio-backend
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn portfolio_api.wsgi:application
    rootDir: backend
    plan: free
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "portfolio-backend.onrender.com,localhost,127.0.0.1"
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString

  # Next.js Frontend
  - type: web
    name: portfolio-frontend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    rootDir: frontend
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
        placeholder: "Enter public backend URL, e.g., https://portfolio-backend.onrender.com"

databases:
  - name: portfolio-db
    plan: free
    postgresMajorVersion: "15"
